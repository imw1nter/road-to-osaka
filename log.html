<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Log | Road to Osaka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Road to <span>Osaka</span></a>
      <nav>
        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="log.html">Run Log</a></li>
          <li><a href="stats.html">Stats</a></li>
          <li><a href="plan.html">Plan</a></li>
          <li><a href="coach.html">AI Coach</a></li>
          <li><a href="race.html">Race Info</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Run Log</h1>
      <p class="page-subtitle">Record every run on the road to Osaka.</p>

      <section class="card">
        <h2 id="form-title">Add a run</h2>
        <form id="run-form" class="form-grid" novalidate>
          <div>
            <label for="run-date">Date</label>
            <input type="date" id="run-date" required>
          </div>
          <div>
            <label for="run-type">Type</label>
            <select id="run-type">
              <option>Easy</option>
              <option>Long run</option>
              <option>Tempo</option>
              <option>Intervals</option>
              <option>Race</option>
            </select>
          </div>
          <div>
            <label for="run-distance">Distance (km)</label>
            <input type="number" id="run-distance" min="0.1" max="200" step="0.01" placeholder="10.0" required>
          </div>
          <div>
            <label for="run-time">Time (h:mm:ss or mm:ss)</label>
            <input type="text" id="run-time" placeholder="55:00" inputmode="numeric" required>
          </div>
          <div>
            <label for="run-effort">Effort: <span id="effort-value">5</span> / 10</label>
            <input type="range" id="run-effort" min="1" max="10" value="5">
          </div>
          <div>
            <label for="run-pace">Pace</label>
            <input type="text" id="run-pace" value="--:-- /km" readonly tabindex="-1">
          </div>
          <div class="full">
            <label for="run-notes">Notes</label>
            <textarea id="run-notes" rows="2" maxlength="300" placeholder="How did it feel?"></textarea>
          </div>
          <p id="form-error" class="form-error full" role="alert" hidden></p>
          <div class="full form-actions">
            <button type="submit" class="btn" id="submit-btn">Save run</button>
            <button type="button" class="btn btn-outline" id="cancel-btn" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="card" style="margin-top:16px">
        <div class="list-header">
          <h2>Past runs</h2>
          <div class="list-tools">
            <label for="filter-type" class="sr-only">Filter by type</label>
            <select id="filter-type">
              <option value="All">All types</option>
              <option>Easy</option>
              <option>Long run</option>
              <option>Tempo</option>
              <option>Intervals</option>
              <option>Race</option>
            </select>
          </div>
        </div>
        <p id="run-summary" class="stat-label"></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Type</th><th>Distance</th><th>Time</th><th>Pace</th><th>Effort</th><th>Notes</th><th></th></tr>
            </thead>
            <tbody id="run-list"></tbody>
          </table>
        </div>
      </section>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; <span id="year"></span> Road to Osaka &middot; Web Programming Project &middot; Afiq
    </div>
  </footer>

  <script src="js/runs.js"></script>
  <script src="js/main.js"></script>
  <script src="js/log.js"></script>
</body>
</html>
