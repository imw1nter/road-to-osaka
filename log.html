<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Run Log | Road to Osaka</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Road to <span>Osaka</span></a>
      <nav>
        <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="log.html">Run Log</a></li>
          <li><a href="stats.html">Stats</a></li>
          <li><a href="plan.html">Plan</a></li>
          <li><a href="coach.html">AI Coach</a></li>
          <li><a href="race.html">Race Info</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Run Log</h1>
      <p class="page-subtitle">Record every run on the road to Osaka.</p>

      <section class="card">
        <h2>Add a run</h2>
        <form id="run-form" class="form-grid">
          <div>
            <label for="run-date">Date</label>
            <input type="date" id="run-date" required>
          </div>
          <div>
            <label for="run-type">Type</label>
            <select id="run-type">
              <option>Easy</option>
              <option>Long run</option>
              <option>Tempo</option>
              <option>Intervals</option>
              <option>Race</option>
            </select>
          </div>
          <div>
            <label for="run-distance">Distance (km)</label>
            <input type="number" id="run-distance" min="0" step="0.01" placeholder="10.0" required>
          </div>
          <div>
            <label for="run-time">Time (hh:mm:ss)</label>
            <input type="text" id="run-time" placeholder="00:55:00" pattern="\d{1,2}:\d{2}:\d{2}" required>
          </div>
          <div>
            <label for="run-effort">Effort (1–10)</label>
            <input type="range" id="run-effort" min="1" max="10" value="5">
          </div>
          <div>
            <label>Pace</label>
            <input type="text" id="run-pace" value="--:-- /km" readonly>
          </div>
          <div class="full">
            <label for="run-notes">Notes</label>
            <textarea id="run-notes" rows="2" placeholder="How did it feel?"></textarea>
          </div>
          <div class="full">
            <button type="submit" class="btn">Save run</button>
          </div>
        </form>
      </section>

      <section class="card" style="margin-top:16px">
        <h2>Past runs</h2>
        <table>
          <thead>
            <tr><th>Date</th><th>Type</th><th>Distance</th><th>Time</th><th>Pace</th><th>Effort</th></tr>
          </thead>
          <tbody id="run-list">
            <tr><td colspan="6" class="stat-label">No runs yet. Saving runs is added in Week 2.</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; <span id="year"></span> Road to Osaka &middot; Web Programming Project &middot; Afiq
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
